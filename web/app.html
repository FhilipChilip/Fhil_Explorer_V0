<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder Explorer (Server)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#dde1e8;--ac:#2563eb;--acbg:#e0eaff;--hv:#eef1f6;--er:#c62828;--ok:#2e9b57}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--tx:#e6e9ef;--mut:#98a2b3;--bd:#323946;--ac:#6ea0ff;--acbg:#27324d;--hv:#262c37;--er:#ff7b72;--ok:#4cc27f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--er)}.dot.on{background:var(--ok)}
.grid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1fr);gap:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;min-width:0}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 8px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
input[type=text],input[type=number],select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;font:inherit;min-width:0}
button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{background:var(--hv)}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button.dan{color:var(--er)}
#tree{height:420px;overflow:auto;border:1px solid var(--bd);border-radius:6px;padding:4px;user-select:none}
.row{display:flex;gap:4px;align-items:center;padding:2px 6px;border-radius:5px;cursor:pointer;white-space:nowrap}
.row:hover{background:var(--hv)}.row.sel{background:var(--acbg)}.row.drop{outline:2px dashed var(--ac);background:var(--acbg)}
.row .sz{margin-left:auto;color:var(--mut);font-size:12px;padding-left:12px}.row.more{color:var(--ac)}
.arrow{width:14px;color:var(--mut);text-align:center;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--bg);border-radius:8px;padding:8px;text-align:center}.stat b{display:block;font-size:20px}.stat span{color:var(--mut);font-size:12px}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:10px;margin:8px 0 0;overflow:auto;max-height:240px;font:13px/1.35 Consolas,monospace}
#msg{min-height:20px;margin:6px 0;font-size:13px}.err{color:var(--er)}.ok{color:var(--ac)}
.res{padding:2px 6px;cursor:pointer;border-radius:4px;font:12.5px Consolas,monospace}.res:hover{background:var(--hv)}
.mut{color:var(--mut)}progress{width:100%;height:8px}
</style>
</head>
<body>
<h1><span class="dot" id="dot"></span>Folder Explorer <span class="mut" style="font-weight:400" id="srv">connecting…</span></h1>
<div class="grid">
  <div class="card">
    <h2>Browser (lazy-loaded)</h2>
    <div class="bar">
      <input type="text" id="name" placeholder="name or path: src/utils/a.py" style="flex:1 1 170px">
      <input type="number" id="size" placeholder="bytes" min="0" style="width:80px">
    </div>
    <div class="bar">
      <button class="pri" id="bFolder">+ Folder</button><button class="pri" id="bFile">+ File</button>
      <button id="bRen">Rename</button><button class="dan" id="bDel">Delete</button>
    </div>
    <div class="bar">
      <input type="text" id="dir" placeholder="Folder on the server PC to scan, e.g. C:\Users\me\Projects" style="flex:1 1 220px">
      <button id="bScan">Scan</button><button id="bCancel" hidden>Cancel</button>
    </div>
    <progress id="prog" hidden></progress>
    <div id="msg"></div>
    <div id="tree"></div>
    <div class="mut" style="margin-top:6px;font-size:12px">Folders load only when opened (200 items per page). Drag onto a folder to move; double-click or F2 to rename.</div>
  </div>
  <div class="card">
    <h2>Summary of <span id="selPath" style="text-transform:none"></span></h2>
    <div class="stats">
      <div class="stat"><b id="nFiles">–</b><span>files</span></div>
      <div class="stat"><b id="nFolders">–</b><span>subfolders</span></div>
      <div class="stat"><b id="nSize">–</b><span>size</span></div>
    </div>
    <div class="bar"><input type="text" id="q" placeholder="Search: *.py, style.css…" style="flex:1 1 140px"><button id="bFind">Search</button></div>
    <div id="results"></div>
    <div class="bar" style="margin-top:8px"><select id="style"><option value="tree">Tree style</option><option value="indent">Indent style</option></select>
      <select id="depth"><option>2</option><option selected>3</option><option>5</option><option>10</option></select><span class="mut" style="align-self:center">levels</span>
      <button id="bCopy">Copy</button></div>
    <pre id="out"></pre>
  </div>
</div>

<script>
const PAGE = 200, $ = id => document.getElementById(id), sleep = ms => new Promise(r => setTimeout(r, ms));
const st = { root: '', rootName: '', sel: '', exp: new Set(), kids: new Map(), drag: null };
class ApiError extends Error {}
const q = o => new URLSearchParams(o).toString();
const fmt = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : b < 1073741824 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1073741824).toFixed(2) + ' GB';
const parentOf = p => p.slice(0, p.lastIndexOf('/'));
function say(t, c = 'ok') { $('msg').textContent = t; $('msg').className = c; }
function online(on) { $('dot').className = 'dot' + (on ? ' on' : ''); if (!on) $('srv').textContent = 'server unreachable — retrying'; }

// Cliente con reintentos (solo GET, con espera exponencial): tolera cortes breves del servidor
async function api(method, url, body, retries = method === 'GET' ? 2 : 0) {
  for (let i = 0; ; i++) {
    try {
      const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined });
      const t = await r.text(); const j = t ? JSON.parse(t) : {};
      if (!r.ok) { const d = j.detail; throw new ApiError(typeof d === 'string' ? d : (d || []).map(x => x.msg).join('; ') || r.statusText); }
      online(true); return j;
    } catch (e) {
      if (e instanceof ApiError) throw e;
      online(false);
      if (i >= retries) throw new Error('Server unreachable');
      await sleep(300 * 2 ** i);
    }
  }
}

async function load(path, more = false) {
  const prev = st.kids.get(path), offset = more && prev ? prev.items.length : 0;
  const r = await api('GET', '/api/children?' + q({ path, offset, limit: PAGE }));
  st.kids.set(path, { items: more && prev ? prev.items.concat(r.items) : r.items, total: r.total });
}
async function reload() {   // tras cualquier cambio: recarga solo las carpetas abiertas
  await Promise.all([...st.exp].map(p => {
    const k = st.kids.get(p), limit = Math.min(1000, Math.max(PAGE, k ? k.items.length : 0));
    return api('GET', '/api/children?' + q({ path: p, limit })).then(r => st.kids.set(p, { items: r.items, total: r.total }))
      .catch(() => { st.exp.delete(p); st.kids.delete(p); });
  }));
  draw(); details();
}
async function reveal(path) {  // abre y carga los ancestros de una ruta
  const parts = path.split('/').filter(Boolean); let cur = '';
  for (const part of parts.slice(0, -1)) {
    cur += '/' + part; st.exp.add(cur);
    if (!st.kids.has(cur)) await load(cur);
  }
}

function rows() {   // aplanado iterativo con pila
  const out = [], stack = [[{ path: st.root, name: st.rootName, type: 'folder' }, 0]];
  while (stack.length) {
    const [n, d] = stack.pop(); out.push([n, d]);
    if (n.type === 'folder' && st.exp.has(n.path)) {
      const k = st.kids.get(n.path); if (!k) continue;
      if (k.items.length < k.total) stack.push([{ more: n.path, left: k.total - k.items.length }, d + 1]);
      for (let i = k.items.length - 1; i >= 0; i--) { const c = k.items[i]; stack.push([{ path: n.path + '/' + c.name, name: c.name, type: c.type, size: c.size }, d + 1]); }
    }
  }
  return out;
}
function draw() {
  const tree = $('tree'), top = tree.scrollTop; tree.textContent = '';
  for (const [n, d] of rows()) {
    const r = document.createElement('div'); r.style.paddingLeft = (6 + d * 16) + 'px';
    if (n.more) {
      r.className = 'row more'; r.textContent = `… load ${Math.min(PAGE, n.left)} more (${n.left} left)`;
      r.onclick = async () => { try { await load(n.more, true); draw(); } catch (e) { say(e.message, 'err'); } };
      tree.append(r); continue;
    }
    r.className = 'row' + (n.path === st.sel ? ' sel' : '');
    const a = document.createElement('span'); a.className = 'arrow'; a.textContent = n.type === 'folder' ? (st.exp.has(n.path) ? '▼' : '▶') : '';
    const t = document.createElement('span'); t.textContent = (n.type === 'folder' ? '📁 ' : '📄 ') + n.name; r.append(a, t);
    if (n.type === 'file') { const s = document.createElement('span'); s.className = 'sz'; s.textContent = fmt(n.size); r.append(s); }
    r.onclick = async () => {
      st.sel = n.path;
      try {
        if (n.type === 'folder') { if (st.exp.has(n.path)) st.exp.delete(n.path); else { st.exp.add(n.path); if (!st.kids.has(n.path)) await load(n.path); } }
      } catch (e) { st.exp.delete(n.path); say(e.message, 'err'); }
      draw(); details();
    };
    r.ondblclick = () => rename(n.path);
    if (n.path !== st.root) {
      r.draggable = true;
      r.ondragstart = e => { st.drag = n.path; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', n.path); };
      r.ondragend = () => { st.drag = null; clearDrop(); };
    }
    if (n.type === 'folder') {
      r.ondragover = e => { if (st.drag) { e.preventDefault(); r.classList.add('drop'); } };
      r.ondragleave = () => r.classList.remove('drop');
      r.ondrop = e => { e.preventDefault(); e.stopPropagation(); dropOn(n.path); };
    }
    tree.append(r);
  }
  tree.scrollTop = top;
}
const clearDrop = () => document.querySelectorAll('.row.drop').forEach(x => x.classList.remove('drop'));

let detailToken = 0;
async function details() {
  const p = st.sel || st.root, token = ++detailToken;
  $('selPath').textContent = p;
  ['nFiles', 'nFolders', 'nSize'].forEach(i => $(i).textContent = '…');
  try {
    const [s, r] = await Promise.all([api('GET', '/api/stats?' + q({ path: p })), api('GET', '/api/render?' + q({ path: p, style: $('style').value, max_depth: $('depth').value }))]);
    if (token !== detailToken) return;   // llegó una respuesta más nueva
    $('nFiles').textContent = s.files.toLocaleString(); $('nFolders').textContent = s.folders.toLocaleString(); $('nSize').textContent = fmt(s.size);
    $('out').textContent = r.text;
  } catch (e) { if (token === detailToken) say(e.message, 'err'); }
}

const typeOf = p => p === st.root ? 'folder' : (st.kids.get(parentOf(p))?.items.find(c => c.name === p.split('/').pop())?.type || 'folder');
function targetFolder() { return typeOf(st.sel) === 'folder' ? st.sel : parentOf(st.sel); }
async function add(kind) {
  const rel = $('name').value.trim().replace(/^\/+|\/+$/g, ''); if (!rel) return say('Enter a name or relative path.', 'err');
  const target = targetFolder(), path = target + '/' + rel;
  try {
    const r = await api('POST', kind === 'file' ? '/api/files' : '/api/folders', { path, size: parseInt($('size').value || '0', 10), parents: true });
    await reveal(r.path); st.sel = r.path; $('name').value = ''; $('size').value = ''; say('Created: ' + r.path); await reload();
  } catch (e) { say(e.message, 'err'); }
}
async function rename(path = st.sel) {
  if (!path || path === st.root) return say('The root cannot be renamed.', 'err');
  const name = prompt('New name:', path.split('/').pop()); if (name === null) return;
  try { const r = await api('POST', '/api/rename', { path, new_name: name.trim() }); st.sel = r.path; say(`Renamed: ${path} → ${r.path}`); await reload(); }
  catch (e) { say(e.message, 'err'); }
}
async function dropOn(dest) {
  const src = st.drag; st.drag = null; clearDrop(); if (!src) return;
  try { const r = await api('POST', '/api/move', { path: src, dest }); st.exp.add(dest); if (!st.kids.has(dest)) await load(dest); st.sel = r.path; say(`Moved: ${src} → ${r.path}`); await reload(); }
  catch (e) { say(e.message, 'err'); }
}
$('bFolder').onclick = () => add('folder'); $('bFile').onclick = () => add('file'); $('bRen').onclick = () => rename();
$('name').onkeydown = e => { if (e.key === 'Enter') add('file'); };
$('bDel').onclick = async () => {
  const p = st.sel; if (!p || p === st.root) return say('Select an item (not the root).', 'err');
  if (!confirm(`Delete ${p} and all its contents?`)) return;
  try { await api('DELETE', '/api/node?' + q({ path: p })); st.exp.delete(p); st.kids.delete(p); st.sel = parentOf(p); say('Deleted: ' + p); await reload(); }
  catch (e) { say(e.message, 'err'); }
};
$('tree').ondragover = e => { if (st.drag) e.preventDefault(); };
$('tree').ondrop = e => { e.preventDefault(); dropOn(st.root); };
document.addEventListener('keydown', e => { if (e.key === 'F2' && !['INPUT', 'SELECT'].includes(document.activeElement.tagName)) { e.preventDefault(); rename(); } });

$('bFind').onclick = find; $('q').onkeydown = e => { if (e.key === 'Enter') find(); };
async function find() {
  const pat = $('q').value.trim(), box = $('results'); box.textContent = ''; if (!pat) return;
  try {
    const r = await api('GET', '/api/find?' + q({ pattern: pat, limit: 50 }));
    const h = document.createElement('div'); h.className = 'mut'; h.textContent = r.results.length + (r.truncated ? '+' : '') + ' result(s)'; box.append(h);
    r.results.forEach(p => { const d = document.createElement('div'); d.className = 'res'; d.textContent = p; d.onclick = async () => { await reveal(p); st.sel = p; draw(); details(); }; box.append(d); });
  } catch (e) { say(e.message, 'err'); }
}
$('style').onchange = $('depth').onchange = details;
$('bCopy').onclick = async () => { try { await navigator.clipboard.writeText($('out').textContent); say('Structure copied.'); } catch { say('Could not copy automatically.', 'err'); } };

// Escaneo de carpetas grandes: trabajo en segundo plano con progreso y cancelación
let job = null;
$('bScan').onclick = async () => {
  const directory = $('dir').value.trim(); if (!directory) return say('Enter a folder path to scan.', 'err');
  try { job = await api('POST', '/api/scan', { directory }); poll(); } catch (e) { say(e.message, 'err'); }
};
$('bCancel').onclick = () => job && api('DELETE', '/api/scan/' + job.id).catch(e => say(e.message, 'err'));
async function poll() {
  $('bScan').disabled = true; $('bCancel').hidden = false; $('prog').hidden = false;
  while (true) {
    try { job = await api('GET', '/api/scan/' + job.id); } catch (e) { say(e.message, 'err'); await sleep(1000); continue; }
    say(`Scanning… ${job.nodes.toLocaleString()} items, ${job.errors} skipped (${job.seconds}s)`);
    if (job.status !== 'running') break; await sleep(400);
  }
  $('bScan').disabled = false; $('bCancel').hidden = true; $('prog').hidden = true;
  if (job.status === 'done') {
    say(`Scan done: ${job.nodes.toLocaleString()} items in ${job.seconds}s` + (job.truncated ? ' (truncated by limit)' : '') + (job.errors ? `, ${job.errors} skipped` : ''));
    await init();
  } else say(job.status === 'cancelled' ? 'Scan cancelled; the current tree was not changed.' : 'Scan failed: ' + job.message, 'err');
}

async function init() {
  const r = await api('GET', '/api/node');
  Object.assign(st, { root: r.path, rootName: r.name, sel: r.path }); st.exp = new Set([r.path]); st.kids.clear();
  await load(r.path); draw(); details();
}
async function heartbeat() {
  try { const h = await api('GET', '/api/health', undefined, 0); $('srv').textContent = `connected · v${h.version} · ${h.dirty ? 'unsaved changes' : 'saved'}`; } catch { }
}
init().catch(e => say(e.message, 'err')); setInterval(heartbeat, 5000); heartbeat();
</script>
</body>
</html>
